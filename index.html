<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Home</title>
    <link rel="stylesheet" href="styles.css">

    <style> /* The CSS within 'style' tags only affects THIS HTML page */
        body { /* changing the formatting of anything within <body> */
        margin: 0; /* By default, this is some value greater than 0, leading to the entire website essentially being shrinked inwards*/
        padding: 0; /* The space around the styled element's content, basically padding lol */
        /* background-color:rgb(19,24,98); Will be changed once final city design is complete */
        background-color:rgb(0, 0, 0);
        }

        h2, p { /* Groups h2 and p elements together to have CSS that affects them both */
        margin: 10px;
        }

        ul { /* Affects all content inside a <ul> list */
        list-style-type: none; /* Gets rid of the bullet point thing */
        margin: 0; /* No more indents from edge of a page */
        padding: 0;
        overflow: hidden; /* controls what happens to content that is too big to fit into an area */
        /* So by saying 'hidden', the content inside this 'ul' list will not go over/beyond the space each list element has */
        /* Making overflow: visible, the entire navbar disappears */
        display: flex;
        justify-content: center;
        background-color: #333333;
        }

        ul li { /* Descendant selector */
        float: left /* affects the position of the navbar options (<li> list elements) in the container <ul> list */
        }

        ul li a { /* Descendant selector, 
        affects elements that have <a> tags within <li> list elements within a <ul> unlisted list */

        /* All that to say that this affects all of the navbar options, since they LINK to another webpage */
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 20px;
        }

        ul li a:hover { /* When hovering over a (<a>)link within a (<li>)list element that is part of an (ul)unlisted_list */
        background-color: #111111; /* Change the bg color of the list element */
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./navbar/chapters.html">Chapters</a></li>
        <li><a href="./navbar/characters.html">Characters</a></li>
        <li><a href="./navbar/districts.html">Districts</a></li>
        <li><a href="./navbar/music.html">Music</a></li>
        <li><a href="./navbar/contact.html">Contact</a></li>
    </ul>

    <h2 style="text-align: center; color: aliceblue; font-size: 40px;">New Yunas</h2>
    <img style="display: block; margin: auto; width: 50%;" src="./images/TempCityMap.JPG" alt="handrawn birdseye view of the city" height="700" width="700">
    <!--Using inline CSS to center the image-->
    

</body>



</html>
